<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-labelledby="karai-title">
  <title id="karai-title">Karai, el duende que cuida tu wallet</title>
  <defs>
    <radialGradient id="k-glow" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".32"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="k-straw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9d983"/>
      <stop offset="1" stop-color="#e2a93a"/>
    </linearGradient>
    <linearGradient id="k-poncho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22426b"/>
      <stop offset="1" stop-color="#162b4d"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="140" r="116" fill="url(#k-glow)"/>
  <ellipse cx="120" cy="245" rx="64" ry="9" fill="#000" opacity=".35"/>

  <!-- boots -->
  <ellipse cx="97" cy="236" rx="17" ry="9" fill="#4a3424"/>
  <ellipse cx="143" cy="236" rx="17" ry="9" fill="#4a3424"/>

  <!-- left arm -->
  <path d="M86 162 C 72 168 64 178 63 190" fill="none" stroke="#2b5a8f" stroke-width="15" stroke-linecap="round"/>
  <circle cx="62" cy="193" r="8.5" fill="#f4c49a"/>

  <!-- poncho -->
  <path d="M120 128 C 80 128 61 170 57 214 C 56 227 66 233 79 233 L 161 233 C 174 233 184 227 183 214 C 179 170 160 128 120 128 Z" fill="url(#k-poncho)"/>
  <path d="M68 205 L 91 193 L 114 205 L 137 193 L 160 205 L 173 198" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M64 220 L 91 207 L 114 220 L 137 207 L 160 220 L 177 211" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- key (behind the hand) -->
  <g stroke="#fbbf24" stroke-linecap="round" fill="none">
    <circle cx="192" cy="146" r="11" stroke-width="5"/>
    <path d="M191 157 L 188 206" stroke-width="5"/>
    <path d="M189 192 L 198 193 M189 200 L 196 201" stroke-width="4"/>
  </g>

  <!-- right arm holding the key -->
  <path d="M155 160 C 170 162 180 168 185 177" fill="none" stroke="#2b5a8f" stroke-width="15" stroke-linecap="round"/>
  <circle cx="188" cy="180" r="8.5" fill="#f4c49a"/>

  <!-- red neckerchief -->
  <path d="M74 134 L 166 134 L 120 176 Z" fill="#ef4444"/>

  <!-- head -->
  <circle cx="90" cy="113" r="7" fill="#eab18a"/>
  <circle cx="150" cy="113" r="7" fill="#eab18a"/>
  <circle cx="120" cy="112" r="30" fill="#f4c49a"/>

  <!-- face -->
  <ellipse cx="101" cy="117" rx="6" ry="4" fill="#f59e8b" opacity=".6"/>
  <ellipse cx="139" cy="117" rx="6" ry="4" fill="#f59e8b" opacity=".6"/>
  <ellipse cx="109" cy="108" rx="3.6" ry="4.6" fill="#0b1220"/>
  <ellipse cx="131" cy="108" rx="3.6" ry="4.6" fill="#0b1220"/>
  <circle cx="110.3" cy="106.3" r="1.4" fill="#fff"/>
  <circle cx="132.3" cy="106.3" r="1.4" fill="#fff"/>
  <path d="M102 101 C 105 97 111 96 115 99" fill="none" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>
  <path d="M125 99 C 129 96 135 97 138 101" fill="none" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>

  <!-- beard: starts at the jaw, tufts at the bottom -->
  <path d="M90 114 C 84 132 86 152 96 166 C 99 176 106 178 110 174 C 113 185 127 185 130 174 C 134 178 141 176 144 166 C 154 152 156 132 150 114 C 145 124 136 130 120 130 C 104 130 95 124 90 114 Z" fill="#f1f5f9" stroke="#d5dde8" stroke-width="2" stroke-linejoin="round"/>
  <path d="M104 146 C 102 154 103 160 106 165 M120 150 C 118 158 119 165 121 171 M136 146 C 138 154 137 160 134 165" fill="none" stroke="#d5dde8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M113 134 Q 120 140 127 134 Q 120 137.5 113 134 Z" fill="#b5534d"/>

  <!-- mustache over the beard, nose on top -->
  <path d="M120 123 C 113 118 103 119 97 127 C 102 132 112 131 120 127 Z" fill="#f8fafc" stroke="#d5dde8" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M120 123 C 127 118 137 119 143 127 C 138 132 128 131 120 127 Z" fill="#f8fafc" stroke="#d5dde8" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="120" cy="118" rx="7" ry="6.5" fill="#e8957a"/>
  <circle cx="117.5" cy="115.8" r="2" fill="#fff" opacity=".5"/>

  <!-- straw hat, slightly tilted -->
  <g transform="translate(0 -15) rotate(-7 120 90)">
    <path d="M87 93 C 87 63 100 45 120 45 C 140 45 153 63 153 93 Z" fill="url(#k-straw)"/>
    <path d="M89 82 L 151 82 L 152 92 L 88 92 Z" fill="#1d3a60"/>
    <path d="M89 86 L 151 86" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="120" cy="95" rx="74" ry="15" fill="#eebf5a"/>
    <path d="M58 96 C 80 104 160 104 182 96" fill="none" stroke="#d29a33" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M70 90 L 76 98 M90 86 L 94 96 M150 86 L 146 96 M170 90 L 164 98" stroke="#d29a33" stroke-width="2" stroke-linecap="round"/>
    <path d="M104 52 C 100 62 99 72 100 80 M136 52 C 140 62 141 72 140 80" fill="none" stroke="#e6b04a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
